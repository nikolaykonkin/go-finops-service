services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: finops
    volumes:
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      # Проверка по TCP (-h 127.0.0.1): во время выполнения init.sql временный
      # сервер слушает только unix-сокет, и проверка без -h сообщила бы
      # о готовности раньше времени.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user -d finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://user:pass@db:5432/finops?sslmode=disable
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
